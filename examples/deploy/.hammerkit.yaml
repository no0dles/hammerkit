# The database password is a secret of your own, never written here: set it before
# running the example, e.g. `export EXAMPLE_DB_PASSWORD=$(openssl rand -hex 16)`.

services:
  api:
    image: node:24-alpine
    deps: [install]
    needs: [postgres]
    cmd: node server.js
    envs:
      # the password comes from PGPASSWORD
      DATABASE_URL: postgres://api@postgres:5432/api
    secrets:
      - from: env:EXAMPLE_DB_PASSWORD
        env: PGPASSWORD
    ports: [3000]
    mounts: [server.js]
    healthcheck:
      cmd: "wget -qO- http://localhost:3000"

  postgres:
    image: postgres:12-alpine
    ports:
      - 5432
    envs:
      POSTGRES_USER: api
      POSTGRES_DB: api
    secrets:
      - from: env:EXAMPLE_DB_PASSWORD
        env: POSTGRES_PASSWORD
    healthcheck:
      cmd: "pg_isready -h 127.0.0.1 -U postgres"

tasks:
  install:
    image: node:24-alpine
    src:
      - package.json
      - package-lock.json
    generates:
      - node_modules
      - package-lock.json
    cmds:
      - npm install

references:
  spa: ./spa

environments:
  development:
    kubernetes:
      namespace: default
      context: popos
      # Gateway API HTTPRoutes: require the Gateway API CRDs and a Gateway named
      # "web" in the cluster
      httpRoutes:
        - host: web.hammerkit.dev
          service: spa:web
          servicePort: 4200
          path: /
          gateway: web
        - host: api.hammerkit.dev
          service: api
          servicePort: 3000
          path: /
          gateway: web
