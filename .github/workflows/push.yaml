name: publish
on:
  push:
    tags:
      - v*
  # started by release.yaml for the tag release-please just created (a tag made
  # with the default workflow token does not trigger the push event above), and
  # by hand to re-run a publish: run it from the v* tag, not from a branch
  workflow_dispatch:
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Resolve version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::run this workflow from a v* tag, not from $GITHUB_REF"
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            PREID=${VERSION#*-}   # e.g. alpha.0
            PREID=${PREID%%.*}    # e.g. alpha
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=$PREID" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: version
    uses: ./.github/workflows/docker-publish.yaml
    with:
      version: ${{ needs.version.outputs.version }}
      latest: ${{ needs.version.outputs.prerelease == 'false' }}
    secrets: inherit

  binaries:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install npm packages
        run: npm ci
      - run: node_modules/.bin/tsc -b tsconfig.json
      - name: Build binaries
        # --public --public-packages "*" embeds plain sources for every package;
        # without it --no-bytecode aborts ("no source breaks final executable", e.g. tslib).
        run: node_modules/.bin/pkg --no-bytecode --public --public-packages "*" --compress Brotli -t "node24-linux-x64,node24-linux-arm64,node24-macos-x64,node24-macos-arm64,node24-win-x64,node24-win-arm64" .
      - name: Ad-hoc sign macOS binaries
        # macOS targets are cross-built on this Linux runner and ship unsigned;
        # Apple Silicon SIGKILLs unsigned Mach-O. rcodesign adds an ad-hoc signature.
        # NB: keep this a plain shell var, not an env: entry — rcodesign reads
        # RCODESIGN_* env vars as config and rejects RCODESIGN_VERSION.
        run: |
          RC_VERSION=0.29.0
          curl -sSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RC_VERSION}/apple-codesign-${RC_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          RCODESIGN="apple-codesign-${RC_VERSION}-x86_64-unknown-linux-musl/rcodesign"
          chmod +x "$RCODESIGN"
          "$RCODESIGN" sign hammerkit-macos-arm64
          "$RCODESIGN" sign hammerkit-macos-x64
      - name: Create release
        # release.yaml has already created the release (with its notes) by the
        # time this runs; a tag pushed by hand has none yet. Either way the
        # binaries end up on it.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          assets=(
            hammerkit-linux-arm64
            hammerkit-linux-x64
            hammerkit-macos-arm64
            hammerkit-macos-x64
            hammerkit-win-arm64.exe
            hammerkit-win-x64.exe
          )
          if [ "$PRERELEASE" = "true" ]; then channel=--prerelease; else channel=--latest; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$VERSION" "$channel"
          else
            gh release create "$TAG" --title "$VERSION" "$channel" "${assets[@]}"
          fi

  npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - name: Upgrade npm for trusted publishing
        # trusted publishing (OIDC) needs npm >= 11.5.1; pin to latest to be sure
        run: npm install -g npm@latest
      - name: Install npm packages
        run: npm ci
      - name: Publish package
        # auth comes from the OIDC trusted publisher configured on npmjs.com;
        # no NPM_TOKEN needed, and provenance is attached automatically
        run: npm publish --tag "${{ needs.version.outputs.npm_tag }}"

  homebrew:
    # Regenerates Formula/hammerkit.rb in the tap from the checksums of the
    # binaries on the release. Needs a token that can push to the tap (the
    # default one is limited to this repository): without the secret the job does
    # nothing and the tap is updated by hand.
    needs: [version, binaries]
    if: needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'hammerkit-macos-*' --pattern 'hammerkit-linux-*'
          sha() { sha256sum "$GITHUB_WORKSPACE/assets/$1" | cut -d' ' -f1; }
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/no0dles/homebrew-hammerkit" tap
          cd tap
          sed -e "s/{{VERSION}}/$TAG/g" \
              -e "s/{{MACOS-ARM64-SHA256}}/$(sha hammerkit-macos-arm64)/" \
              -e "s/{{MACOS-AMD64-SHA256}}/$(sha hammerkit-macos-x64)/" \
              -e "s/{{LINUX-ARM64-SHA256}}/$(sha hammerkit-linux-arm64)/" \
              -e "s/{{LINUX-AMD64-SHA256}}/$(sha hammerkit-linux-x64)/" \
              hammerkit.rb.tmpl > Formula/hammerkit.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/hammerkit.rb
          git commit -m "hammerkit $TAG"
          git push
