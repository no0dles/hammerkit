name: hammerkit
description: >
  Node 24, a pinned published hammerkit, and the shared CI cache (a GHCR
  repository) pulled for the given tasks. The cache is an optimisation only:
  when GHCR is unreachable or the token can't read it, the pull is skipped and
  the tasks simply run.
inputs:
  tasks:
    description: tasks whose cache entries to pull
    required: true
  version:
    description: >
      published hammerkit used to build this repository; at least the release that
      has `explain --check`, which the integration job uses to skip its cluster
    default: '1.13.0'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install hammerkit
      shell: bash
      run: npm install -g "hammerkit@${{ inputs.version }}"
    # A flaky test that passed once is a cached pass. To retry for real, put
    # [no-cache] in the head commit message, or run the workflow by hand
    # (workflow_dispatch): the job then neither pulls nor pushes, so every task runs
    # and the shared cache is left as it was.
    - name: Decide whether to bypass the cache
      shell: bash
      env:
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        if [ "$DISPATCH" = true ] || [[ "$COMMIT_MESSAGE" == *"[no-cache]"* ]]; then
          echo "HAMMERKIT_CACHE_BYPASS=1" >> "$GITHUB_ENV"
          echo "::notice::cache bypassed, every task runs"
        fi
    - name: Log in to the cache registry
      if: env.HAMMERKIT_CACHE_BYPASS != '1'
      continue-on-error: true
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Pull cached results
      if: env.HAMMERKIT_CACHE_BYPASS != '1'
      continue-on-error: true
      shell: bash
      run: |
        for task in ${{ inputs.tasks }}; do
          hammerkit cache pull "$task" --remote ci
        done
