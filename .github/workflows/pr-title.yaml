name: pr-title
# Releases are derived from commit messages (see release.yaml), and master is
# squash-merged, so the PR title is the commit message that counts. This check
# keeps it in the Conventional Commits shape and keeps a major release a
# deliberate act: a breaking-change marker is rejected here, a major is released
# with a `Release-As: N.0.0` footer (docs/contribution/publish).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          breaking='^[a-z]+(\([^)]*\))?!'
          if [[ "$TITLE" =~ $breaking ]] || printf '%s' "$BODY" | grep -Eq '^BREAKING[ -]CHANGE:'; then
            echo "::error title=Major release::A breaking-change marker would release a new major version automatically. Describe the break in plain words instead; a major release is cut on request with a 'Release-As: N.0.0' footer on the merge commit (see docs/contribution/publish)."
            exit 1
          fi
          pattern='^(feat|fix|perf|revert|docs|refactor|test|build|ci|chore|style)(\([a-z0-9._/-]+\))?: .+'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error title=PR title::'$TITLE' is not a conventional commit title. Use '<type>: <what changed>' with type feat (minor release), fix or perf (patch release), or docs, refactor, test, build, ci, chore, style, revert (no release)."
            exit 1
          fi
