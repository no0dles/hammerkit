# The database password is a secret of your own, never written here: set it before
# running the example, e.g. `export EXAMPLE_DB_PASSWORD=$(openssl rand -hex 16)`.

services:
  postgres:
    image: postgres:12-alpine
    ports: [:5432]
    envs:
      POSTGRES_USER: api
      POSTGRES_DB: api
    secrets:
      - from: env:EXAMPLE_DB_PASSWORD
        env: POSTGRES_PASSWORD
    volumes:
      - "postgres-db:/var/lib/postgresql/data"
    healthcheck:
      # probe over TCP: during first-time init the image runs a temporary server that only listens on the unix socket
      cmd: "pg_isready -h 127.0.0.1 -U postgres"

tasks:
  example:service:
    needs: [postgres]
    image: postgres:12-alpine
    secrets:
      - from: env:EXAMPLE_DB_PASSWORD
        env: PGPASSWORD
    cmds:
      - psql -h postgres -U api -d api -c "CREATE TABLE test (id uuid primary key)"

  example:
    description: clean example
    generates:
      - node_modules
    src:
      - package.json
    cmds:
      - npm install

  docker:example:
    description: clean example
    image: node:24-alpine
    mounts:
      - $PWD/.npm:/.npm
      - $PWD/.config:/.config
    generates:
      - node_modules
    src:
      - package.json
    cmds:
      - npm install
