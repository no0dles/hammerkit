services:
  postgres:
    image: postgres:12-alpine
    ports: [:5432]
    labels:
      app: example
    envs:
      POSTGRES_USER: api
      POSTGRES_DB: api
      POSTGRES_PASSWORD: 123456
    healthcheck:
      cmd: "pg_isready -h 127.0.0.1 -U postgres"

references:
  a: ./projects/a
  b: ./projects/b
