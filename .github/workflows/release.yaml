name: release
# Every push to master is released from its commit messages (Conventional
# Commits): fix/perf make a patch, feat a minor, a breaking change a major. It
# bumps package.json, writes CHANGELOG.md, tags vX.Y.Z and creates the GitHub
# release (config: .releaserc.json), then starts push.yaml for the tag.
on:
  push:
    branches:
      - master
concurrency:
  group: release
permissions:
  contents: write # release commit, tag and GitHub release
  actions: write # starts push.yaml: a tag pushed with this token does not
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags decide the last release
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx -y -p semantic-release@25 -p @semantic-release/changelog@7 -p @semantic-release/git@11 -p @semantic-release/exec@7 semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
