# Consumes the pnpm entry the way a project would. The catalog spec replaces
# CATALOG_URL with a git repository holding this catalog.
includes:
  pnpm:
    git: CATALOG_URL
    path: catalog/pnpm
    with:
      NODE_VERSION: 22

tasks:
  verify:
    description: the installed dependencies are usable
    image: node:22-alpine
    src: [package.json]
    deps: [pnpm:install]
    cmds:
      - node -e "require('ms')"
