name: release
# Every push to master is released from its commit messages (Conventional
# Commits): fix/perf make a patch, feat a minor, a breaking change a major. It
# bumps package.json, writes CHANGELOG.md and tags vX.Y.Z (config:
# .releaserc.json), then starts push.yaml for the tag, which creates the GitHub
# release together with its binaries.
# release/2.1.0 publishes prereleases (2.1.0-next.N: npm and Docker next,
# no latest); remove it here and in .releaserc.json before #165 merges. Every
# release, stable too, also moves next when it is the newest (push.yaml).
on:
  push:
    branches:
      - master
      - release/2.1.0
concurrency:
  group: release
permissions:
  contents: write # release commit and tag
  actions: write # starts push.yaml: a tag pushed with this token does not
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags decide the last release
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npx -y -p semantic-release@25 -p @semantic-release/changelog@7 -p @semantic-release/git@11 -p @semantic-release/exec@7 semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
