name: test
on:
  push:
    branches:
      - '**'
  # a retry that ignores the shared cache, see .github/actions/hammerkit
  workflow_dispatch:
# A newer push to the same branch supersedes a running check; master keeps every
# run so its history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # Only windows-latest: it is the one platform with no container runtime,
        # so the portable unit suite is the only thing we can run here — and it
        # is the separator-sensitive platform we most need to cover. ubuntu and
        # macOS instead run the integration suite (the integration jobs below),
        # which is a superset of the unit suite plus the full container/k8s path;
        # the ubuntu run is the single coverage report uploaded to Codacy.
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install npm packages
        run: npm ci
      - name: Run tests
        run: npm test
        timeout-minutes: 15
        env:
          VERBOSE: true
      - name: Archive test artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: console-log-${{ matrix.os }}
          path: |
            logs

  # Linux-container coverage on macOS via colima. Kept separate from the fast
  # unit matrix so colima flakiness can't gate the portable suites. Must run on
  # an Intel runner: Apple-Silicon GitHub runners lack the nested virtualization
  # colima needs. macos-15-intel is the last hosted Intel image (until ~2027).
  # k8s specs no-op (CLUSTER_NAME unset) and the registry self-provisions via
  # docker (REGISTRY unset); see src/testing/requires-* and ensure-local-registry.
  #
  # DISABLED: ~40 min per push on the emulated Intel runner, and colima is not
  # Docker Desktop, so it does not catch Docker-Desktop-specific behavior anyway.
  # GitHub's Apple Silicon runners cannot run Docker at all (no nested
  # virtualization). Remove the `if` to re-enable.
  macos-containers:
    name: integration (macos-latest)
    if: false
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      LINUX_CONTAINERS: 'true'
      VERBOSE: 'true'
      # the x86-emulated colima daemon is slow; keep a generous per-spec ceiling
      # (local defaults to 120s for fast hang detection)
      HAMMERKIT_TEST_TIMEOUT: '900000'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Setup Docker on macOS
        uses: douglascamata/setup-docker-macos-action@v1.1.0
        with:
          lima: latest
          colima: latest
          colima-additional-options: '--cpu 3 --memory 6 --disk 20'
      - name: Point default docker socket at colima (for dockerode)
        run: sudo ln -sf "$HOME/.colima/default/docker.sock" /var/run/docker.sock
      - name: Install npm packages
        run: npm ci
      # Serialize: the x86-emulated colima daemon is slow and shares one host;
      # running suites one at a time avoids volume/container races and gives each
      # spec the full daemon, keeping it within the (generous) timeouts.
      - name: Run container integration tests
        run: npm run test:integration -- --no-file-parallelism
      - name: Archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: macos-container-logs
          path: |
            logs
            temp

  # Full container + Kubernetes integration on hosted Linux runners, in two jobs
  # that run side by side (the matrix below): `docker` runs every spec that needs
  # only a Docker daemon plus a registry:2 container for the package-push spec, and
  # `kubernetes` runs the specs that need a cluster (a throwaway kind cluster), so
  # the cluster is only started where it is used. Each suite is one hammerkit task
  # (see .hammerkit.yaml), cached on its own. ubuntu-latest ships a native, running
  # Docker daemon. HAMMERKIT_FULL_INTEGRATION makes the linux-container and k8s
  # gates assert rather than no-op; requiresWindowsContainers is unused, so leaving
  # WINDOWS_CONTAINERS unset does not fail anything (see src/testing/requires-*).
  linux-integration:
    name: integration ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [docker, kubernetes]
    permissions:
      contents: read
      packages: write # the shared build cache lives in GHCR
    env:
      LINUX_CONTAINERS: 'true'
      CLUSTER_NAME: hammerkit-ci
      REGISTRY: localhost:5000
      HAMMERKIT_FULL_INTEGRATION: 'true'
      HAMMERKIT_TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # native docker is fast, but the first pull of the node/postgres images into
      # the cluster still costs time; keep a generous per-spec ceiling
      HAMMERKIT_TEST_TIMEOUT: '600000'
      VERBOSE: 'true'
      # Docker Hub rate-limits anonymous pulls per runner IP, which hosted runners
      # share. With the secret set, the daemon's pulls are authenticated.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up hammerkit and the shared cache
        uses: ./.github/actions/hammerkit
        with:
          tasks: test:${{ matrix.suite }}
      # hammerkit reads the credentials `docker login` stores when it pulls an image.
      # Without the secret (forks, or not set up) the login is skipped and pulls
      # stay anonymous, as before.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      # The suite is a hammerkit task: when this tree was already tested green, the
      # pull above restored its result, and the cluster and registry below are not
      # worth starting. Without a reachable cache this is always a miss, so the job
      # runs as it always did.
      # `explain --check` exits 1 for a miss, and for a hammerkit too old to know
      # the flag, so they are started whenever in doubt.
      - name: Plan
        id: plan
        run: |
          if hammerkit explain test:${{ matrix.suite }} --check; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
      # A current Kubernetes: the Gateway API CRDs below need 1.31+ (their CEL
      # validations use isIP). Pinned by digest, as kind recommends.
      - name: Create kind cluster
        if: matrix.suite == 'kubernetes' && steps.plan.outputs.hit != 'true'
        uses: helm/kind-action@v1.15.0
        with:
          cluster_name: hammerkit-ci
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      # hammerkit's k8s specs use process.env.CLUSTER_NAME directly as the kube
      # context (`context: process.env.CLUSTER_NAME`). kind names the context
      # `kind-<cluster>`, so rename it to match what the specs ask for.
      - name: Name the kube context after CLUSTER_NAME
        if: matrix.suite == 'kubernetes' && steps.plan.outputs.hit != 'true'
        run: kubectl config rename-context "kind-${CLUSTER_NAME}" "${CLUSTER_NAME}"
      # Services are exposed through Gateway API HTTPRoutes, a CRD kind does not ship
      # with; environment.spec.ts creates and removes one.
      - name: Install the Gateway API CRDs
        if: matrix.suite == 'kubernetes' && steps.plan.outputs.hit != 'true'
        run: kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.2/standard-install.yaml
      # docker-package-registry.spec.ts only probes an externally provided REGISTRY
      # for liveness (it never manages one), so stand up a registry on localhost:5000.
      - name: Start local registry
        if: matrix.suite == 'docker' && steps.plan.outputs.hit != 'true'
        run: docker run -d --restart=always -p 5000:5000 --name registry registry:2
      # Serialize (inside the task): one single-node kind cluster on a 4-vCPU
      # runner, so running suites one at a time avoids scheduling/volume races.
      # HAMMERKIT_TEST_RUN_ID is not passed on: hammerkit hands a task only the
      # variables it declares, and a per-run value would defeat the cache.
      - name: Run integration tests
        run: hammerkit run test:${{ matrix.suite }} --no-summary
      - name: Share the result
        uses: ./.github/actions/hammerkit-push
        with:
          tasks: test:${{ matrix.suite }}
      # The coverage job below merges the reports of both suites.
      - name: Keep the coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage/${{ matrix.suite }}/lcov.info
      - name: Archive logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: linux-integration-logs-${{ matrix.suite }}
          path: |
            logs
            temp

  # The single coverage source for Codacy, and the one check that stands for the
  # integration suite (the name is unchanged from when it was a single job, so a
  # required check keeps working). It runs on every push, PRs included, so coverage
  # shows up on PRs. Integration mode is a superset of the unit suite (see
  # vitest.config.ts): the docker suite carries the fast unit and error-path specs,
  # the kubernetes suite the cluster path, and Codacy gets both reports in one upload.
  integration-result:
    name: integration (ubuntu-latest)
    needs: linux-integration
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Both suites passed
        if: needs.linux-integration.result != 'success'
        run: |
          echo "::error::the integration suites finished as ${{ needs.linux-integration.result }}"
          exit 1
      - name: Download the coverage reports
        uses: actions/download-artifact@v5
        with:
          pattern: coverage-*
      - name: Upload coverage
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@master
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage-docker/lcov.info,coverage-kubernetes/lcov.info
