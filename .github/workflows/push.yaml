name: publish
on:
  push:
    tags:
      - v*
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      npm_tag: ${{ steps.version.outputs.npm_tag }}
    steps:
      - name: Resolve version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            PREID=${VERSION#*-}   # e.g. alpha.0
            PREID=${PREID%%.*}    # e.g. alpha
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=$PREID" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: no0dles
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          TAGS="no0dles/hammerkit:${{ needs.version.outputs.version }}"
          if [[ "${{ needs.version.outputs.prerelease }}" == "false" ]]; then
            TAGS="$TAGS,no0dles/hammerkit:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  binaries:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install npm packages
        run: npm ci
      - run: node_modules/.bin/tsc -b tsconfig.json
      - name: Build binaries
        # --public --public-packages "*" embeds plain sources for every package;
        # without it --no-bytecode aborts ("no source breaks final executable", e.g. tslib).
        run: node_modules/.bin/pkg --no-bytecode --public --public-packages "*" -t "node24-linux-x64,node24-linux-arm64,node24-macos-x64,node24-macos-arm64,node24-win-x64,node24-win-arm64" .
      - name: Ad-hoc sign macOS binaries
        # macOS targets are cross-built on this Linux runner and ship unsigned;
        # Apple Silicon SIGKILLs unsigned Mach-O. rcodesign adds an ad-hoc signature.
        # NB: keep this a plain shell var, not an env: entry — rcodesign reads
        # RCODESIGN_* env vars as config and rejects RCODESIGN_VERSION.
        run: |
          RC_VERSION=0.29.0
          curl -sSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RC_VERSION}/apple-codesign-${RC_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          RCODESIGN="apple-codesign-${RC_VERSION}-x86_64-unknown-linux-musl/rcodesign"
          chmod +x "$RCODESIGN"
          "$RCODESIGN" sign hammerkit-macos-arm64
          "$RCODESIGN" sign hammerkit-macos-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ needs.version.outputs.version }}" \
            ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '--latest' }} \
            hammerkit-linux-arm64 \
            hammerkit-linux-x64 \
            hammerkit-macos-arm64 \
            hammerkit-macos-x64 \
            hammerkit-win-arm64.exe \
            hammerkit-win-x64.exe

  npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - name: Upgrade npm for trusted publishing
        # trusted publishing (OIDC) needs npm >= 11.5.1; pin to latest to be sure
        run: npm install -g npm@latest
      - name: Install npm packages
        run: npm ci
      - name: Publish package
        # auth comes from the OIDC trusted publisher configured on npmjs.com;
        # no NPM_TOKEN needed, and provenance is attached automatically
        run: npm publish --tag "${{ needs.version.outputs.npm_tag }}"
