# The database password is a secret of your own, never written here: set it before
# running the example, e.g. `export EXAMPLE_DB_PASSWORD=$(openssl rand -hex 16)`.

environments:
  default:
    kubernetes:
      context: docker-desktop

services:
  postgres:
    image: postgres:12-alpine
    envs:
      POSTGRES_USER: 'postgres'
      POSTGRES_DB: 'demo'
    secrets:
      - from: env:EXAMPLE_DB_PASSWORD
        env: POSTGRES_PASSWORD
    volumes:
    - data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  api:
    image: node:24-alpine
    deps: [ install ]
    needs: [ postgres ]
    ports:
      - 3000
    labels:
      app: example
    src:
      - index.js
    secrets:
      - from: env:EXAMPLE_DB_PASSWORD
        env: PGPASSWORD
    cmd: node index.js

tasks:
  install:
    image: node:24-alpine
    mounts:
      # cache npm downloads between runs (/root/.npm is npm's default cache dir)
      - .npm-cache:/root/.npm
    src:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    cmds:
      - npm ci
