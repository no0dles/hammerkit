name: hammerkit
description: >
  Node 24, a pinned published hammerkit, and the shared CI cache (a GHCR
  repository) pulled for the given tasks. The cache is an optimisation only:
  when GHCR is unreachable or the token can't read it, the pull is skipped and
  the tasks simply run.
inputs:
  tasks:
    description: tasks whose cache entries to pull
    required: true
  version:
    description: >
      published hammerkit used to build this repository; at least the release that
      has `explain --check`, which the integration job uses to skip its cluster
    default: '1.11.3'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install hammerkit
      shell: bash
      run: npm install -g "hammerkit@${{ inputs.version }}"
    - name: Log in to the cache registry
      continue-on-error: true
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Pull cached results
      continue-on-error: true
      shell: bash
      run: |
        for task in ${{ inputs.tasks }}; do
          hammerkit cache pull "$task" --remote ci
        done
