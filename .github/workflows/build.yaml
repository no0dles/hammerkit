name: build
on:
  push:
    branches:
      - '**'
  # a retry that ignores the shared cache, see .github/actions/hammerkit
  workflow_dispatch:
# A newer push to the same branch supersedes a running check; master keeps every
# run so its history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  npm-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the shared build cache lives in GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up hammerkit and the shared cache
        uses: ./.github/actions/hammerkit
        with:
          tasks: check
      # install, prettier, eslint and tsc, skipped when the tree was already
      # checked (see .hammerkit.yaml); dist is restored on a hit
      - name: Check and build
        run: hammerkit run check --no-summary
      - name: Share the results
        uses: ./.github/actions/hammerkit-push
        with:
          tasks: check
      # The published package is an allowlist (`files` in package.json): install
      # the packed tarball like a user would and run it, so a missing file fails
      # here instead of after a release. --ignore-scripts: on a cache hit there is
      # no node_modules for prepack's tsc, and dist is already restored.
      - name: Smoke test the packed package
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/hammerkit-*.tgz
          cd "$RUNNER_TEMP"
          printf 'tasks:\n  hello:\n    src: [in.txt]\n    cmds: [cat in.txt]\n' > .hammerkit.yaml
          echo hello > in.txt
          hammerkit --version
          hammerkit validate
          hammerkit run hello --no-summary
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: no0dles/hammerkit:ci
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
